<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaCalc X — Scientific Calculator</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg:#050816;
    --card:rgba(13,20,42,.72);
    --card2:rgba(18,28,55,.72);
    --text:#f5f7ff;
    --muted:#8490ad;
    --blue:#4da3ff;
    --purple:#8b5cf6;
    --cyan:#00e5ff;
    --pink:#ff4ecd;
    --border:rgba(255,255,255,.10);
}

body{
    min-height:100vh;
    overflow-x:hidden;
    font-family:Inter,Arial,sans-serif;
    color:var(--text);
    background:
        radial-gradient(circle at 10% 20%,#29156e 0%,transparent 28%),
        radial-gradient(circle at 90% 80%,#003d62 0%,transparent 30%),
        var(--bg);
    display:flex;
    justify-content:center;
    align-items:center;
}

/* ================= BACKGROUND ================= */

.bg-orb{
    position:fixed;
    border-radius:50%;
    filter:blur(90px);
    pointer-events:none;
    z-index:-3;
}

.orb1{
    width:350px;
    height:350px;
    background:#6c3cff;
    top:-150px;
    left:-100px;
    animation:orb1 9s infinite alternate ease-in-out;
}

.orb2{
    width:400px;
    height:400px;
    background:#00bfff;
    right:-150px;
    bottom:-180px;
    animation:orb2 11s infinite alternate ease-in-out;
}

@keyframes orb1{
    to{transform:translate(160px,120px) scale(1.2);}
}

@keyframes orb2{
    to{transform:translate(-120px,-100px) scale(1.25);}
}

#particles{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-2;
}

.particle{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background:#fff;
    box-shadow:0 0 12px #fff;
    animation:particleMove linear infinite;
    opacity:.5;
}

@keyframes particleMove{
    from{
        transform:translateY(110vh) scale(0);
    }
    20%{opacity:.8;}
    to{
        transform:translateY(-10vh) scale(1);
    }
}

/* ================= MAIN ================= */

.app{
    width:min(1100px,95%);
    display:grid;
    grid-template-columns:minmax(500px,1fr) 300px;
    gap:25px;
    padding:25px 0;
}

/* ================= CALCULATOR ================= */

.calculator{
    position:relative;
    padding:25px;
    border:1px solid var(--border);
    border-radius:32px;
    background:linear-gradient(
        145deg,
        rgba(25,34,65,.82),
        rgba(7,12,28,.88)
    );
    backdrop-filter:blur(25px);
    box-shadow:
        0 30px 90px rgba(0,0,0,.5),
        inset 0 1px rgba(255,255,255,.08);
    overflow:hidden;
    transform-style:preserve-3d;
    animation:calculatorIn .9s cubic-bezier(.2,.8,.2,1);
}

@keyframes calculatorIn{
    from{
        opacity:0;
        transform:translateY(60px) rotateX(12deg) scale(.92);
    }
    to{
        opacity:1;
        transform:none;
    }
}

.calculator::before{
    content:"";
    position:absolute;
    width:300px;
    height:300px;
    background:var(--purple);
    filter:blur(100px);
    opacity:.08;
    top:-150px;
    right:-100px;
    pointer-events:none;
}

/* Mouse glow */

.mouse-glow{
    position:absolute;
    width:250px;
    height:250px;
    border-radius:50%;
    background:radial-gradient(
        circle,
        rgba(0,229,255,.12),
        transparent 65%
    );
    transform:translate(-50%,-50%);
    pointer-events:none;
    transition:.08s;
}

/* ================= HEADER ================= */

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.brand{
    font-size:25px;
    font-weight:900;
    letter-spacing:-1px;
}

.brand span{
    background:linear-gradient(
        90deg,
        var(--cyan),
        var(--purple),
        var(--pink)
    );
    background-size:200%;
    -webkit-background-clip:text;
    color:transparent;
    animation:gradientMove 3s linear infinite;
}

@keyframes gradientMove{
    to{background-position:200% center;}
}

.subtitle{
    color:var(--muted);
    font-size:10px;
    letter-spacing:2px;
    margin-top:3px;
}

.status{
    display:flex;
    align-items:center;
    gap:7px;
    padding:8px 12px;
    border-radius:20px;
    background:rgba(0,255,180,.07);
    border:1px solid rgba(0,255,180,.15);
    color:#58ffc6;
    font-size:10px;
    font-weight:bold;
}

.status-dot{
    width:7px;
    height:7px;
    background:#43ffc1;
    border-radius:50%;
    box-shadow:0 0 12px #43ffc1;
    animation:pulse 1.2s infinite;
}

@keyframes pulse{
    50%{transform:scale(1.7);opacity:.4;}
}

/* ================= DISPLAY ================= */

.display{
    position:relative;
    min-height:155px;
    border-radius:24px;
    padding:22px;
    margin-bottom:15px;
    background:
        linear-gradient(
            135deg,
            rgba(4,10,25,.96),
            rgba(15,25,48,.92)
        );
    border:1px solid rgba(255,255,255,.08);
    box-shadow:
        inset 0 0 35px rgba(0,0,0,.3),
        0 0 30px rgba(76,130,255,.06);
    overflow:hidden;
}

.display::after{
    content:"";
    position:absolute;
    left:-100%;
    top:0;
    width:70%;
    height:1px;
    background:linear-gradient(
        90deg,
        transparent,
        #00e5ff,
        transparent
    );
    animation:scan 4s infinite;
}

@keyframes scan{
    0%{left:-100%}
    50%,100%{left:150%}
}

.expression{
    color:#687793;
    text-align:right;
    min-height:28px;
    font-size:14px;
    word-break:break-all;
}

.result{
    text-align:right;
    font-size:43px;
    font-weight:800;
    letter-spacing:-2px;
    overflow-x:auto;
    white-space:nowrap;
    text-shadow:
        0 0 18px rgba(77,163,255,.2);
    scrollbar-width:none;
}

.result::-webkit-scrollbar{
    display:none;
}

.result.pop{
    animation:resultPop .25s ease;
}

@keyframes resultPop{
    0%{
        transform:scale(.94);
        filter:blur(3px);
    }
    60%{transform:scale(1.04);}
    100%{
        transform:scale(1);
        filter:none;
    }
}

/* ================= MEMORY ================= */

.memory{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:7px;
    margin-bottom:10px;
}

/* ================= BUTTON GRID ================= */

.buttons{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:9px;
}

button{
    position:relative;
    overflow:hidden;
    border:none;
    min-height:54px;
    border-radius:15px;
    cursor:pointer;
    color:#edf3ff;
    font-size:14px;
    font-weight:700;
    background:
        linear-gradient(
            145deg,
            rgba(35,48,82,.9),
            rgba(18,27,50,.95)
        );
    border:1px solid rgba(255,255,255,.07);
    box-shadow:
        0 6px 0 rgba(4,7,18,.65),
        0 10px 20px rgba(0,0,0,.15),
        inset 0 1px rgba(255,255,255,.06);
    transition:
        transform .12s,
        box-shadow .12s,
        filter .2s,
        background .2s;
}

button:hover{
    filter:brightness(1.3);
    transform:translateY(-3px);
    box-shadow:
        0 9px 0 rgba(4,7,18,.65),
        0 15px 28px rgba(0,0,0,.3),
        0 0 18px rgba(77,163,255,.12);
}

button:active,
button.touched{
    transform:
        translateY(5px)
        scale(.94);
    box-shadow:
        0 1px 0 rgba(4,7,18,.7),
        0 0 25px rgba(0,229,255,.3),
        inset 0 0 20px rgba(255,255,255,.08);
    filter:brightness(1.5);
}

/* ripple */

.ripple{
    position:absolute;
    border-radius:50%;
    transform:scale(0);
    background:rgba(255,255,255,.35);
    animation:ripple .55s ease-out;
    pointer-events:none;
}

@keyframes ripple{
    to{
        transform:scale(5);
        opacity:0;
    }
}

.function{
    color:#b9b2ff;
    background:
        linear-gradient(
            145deg,
            #27244c,
            #17182e
        );
}

.operator{
    color:#7ec5ff;
    background:
        linear-gradient(
            145deg,
            #1e365a,
            #15243e
        );
}

.clear{
    color:#ff82ad;
    background:
        linear-gradient(
            145deg,
            #51253f,
            #281628
        );
}

.equal{
    grid-column:span 2;
    color:white;
    background:
        linear-gradient(
            135deg,
            #6d45ff,
            #008cff,
            #00d9ff
        );
    background-size:200% 200%;
    box-shadow:
        0 7px 0 #172c61,
        0 0 25px rgba(77,163,255,.2);
    animation:equalGradient 4s ease infinite;
}

@keyframes equalGradient{
    0%{background-position:0 50%}
    50%{background-position:100% 50%}
    100%{background-position:0 50%}
}

/* ================= HISTORY ================= */

.history{
    min-height:500px;
    padding:22px;
    border-radius:28px;
    background:
        linear-gradient(
            145deg,
            rgba(20,29,55,.78),
            rgba(8,14,30,.85)
        );
    border:1px solid var(--border);
    backdrop-filter:blur(25px);
    box-shadow:0 25px 70px rgba(0,0,0,.4);
    animation:historyIn 1s ease;
}

@keyframes historyIn{
    from{
        opacity:0;
        transform:translateX(40px);
    }
    to{
        opacity:1;
        transform:none;
    }
}

.history-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.history-head h2{
    font-size:18px;
}

.clear-history{
    min-height:30px;
    padding:5px 10px;
    font-size:10px;
}

.history-list{
    max-height:650px;
    overflow:auto;
}

.history-item{
    padding:13px;
    margin-bottom:9px;
    border-radius:14px;
    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.05);
    cursor:pointer;
    transition:.2s;
}

.history-item:hover{
    transform:translateX(5px);
    border-color:#6c63ff;
    box-shadow:0 0 20px rgba(108,99,255,.1);
}

.history-expression{
    color:#6f7d99;
    font-size:11px;
    margin-bottom:5px;
}

.history-result{
    font-size:16px;
    font-weight:bold;
}

.empty{
    color:#68758f;
    text-align:center;
    margin-top:100px;
    font-size:13px;
}

/* ================= TOAST ================= */

.toast{
    position:fixed;
    bottom:30px;
    left:50%;
    transform:translate(-50%,120px);
    opacity:0;
    padding:12px 20px;
    border-radius:30px;
    background:#111a31;
    border:1px solid #3d4b70;
    box-shadow:0 0 30px rgba(0,229,255,.15);
    transition:.35s;
    z-index:999;
    font-size:13px;
}

.toast.show{
    transform:translate(-50%,0);
    opacity:1;
}

/* ================= RESPONSIVE ================= */

@media(max-width:850px){

    .app{
        grid-template-columns:1fr;
    }

    .history{
        min-height:300px;
    }
}

@media(max-width:550px){

    .app{
        width:100%;
        padding:10px;
    }

    .calculator{
        padding:15px;
        border-radius:22px;
    }

    .buttons{
        gap:6px;
    }

    button{
        min-height:47px;
        font-size:12px;
        border-radius:12px;
    }

    .result{
        font-size:32px;
    }

    .history{
        border-radius:22px;
    }
}
</style>
</head>

<body>

<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>
<div id="particles"></div>

<div class="app">

<!-- ================= CALCULATOR ================= -->

<section class="calculator" id="calculator">

    <div class="mouse-glow" id="mouseGlow"></div>

    <div class="header">

        <div>
            <div class="brand">
                Nova<span>Calc X</span>
            </div>

            <div class="subtitle">
                ADVANCED SCIENTIFIC ENGINE
            </div>
        </div>

        <div class="status">
            <span class="status-dot"></span>
            ONLINE
        </div>

    </div>

    <!-- DISPLAY -->

    <div class="display">

        <div
            class="expression"
            id="expression">
        </div>

        <div
            class="result"
            id="result">
            0
        </div>

    </div>

    <!-- MEMORY -->

    <div class="memory">

        <button onclick="memoryClear()">MC</button>
        <button onclick="memoryRecall()">MR</button>
        <button onclick="memoryAdd()">M+</button>
        <button onclick="memorySub()">M−</button>
        <button onclick="copyResult()">COPY</button>

    </div>

    <!-- BUTTONS -->

    <div class="buttons">

        <button
            class="function"
            id="angle"
            onclick="toggleAngle()">
            DEG
        </button>

        <button
            class="function"
            onclick="add('sin(')">
            sin
        </button>

        <button
            class="function"
            onclick="add('cos(')">
            cos
        </button>

        <button
            class="function"
            onclick="add('tan(')">
            tan
        </button>

        <button
            class="function"
            onclick="add('log(')">
            log
        </button>

        <button
            class="function"
            onclick="add('ln(')">
            ln
        </button>

        <button
            class="function"
            onclick="add('√(')">
            √
        </button>

        <button
            class="function"
            onclick="add('π')">
            π
        </button>

        <button
            class="function"
            onclick="add('e')">
            e
        </button>

        <button
            class="function"
            onclick="add('^2')">
            x²
        </button>

        <button
            class="function"
            onclick="add('^')">
            xʸ
        </button>

        <button
            class="function"
            onclick="factorial()">
            x!
        </button>

        <button
            class="clear"
            onclick="clearAll()">
            AC
        </button>

        <button
            class="clear"
            onclick="deleteLast()">
            DEL
        </button>

        <button
            class="function"
            onclick="add('%')">
            %
        </button>

        <button
            class="operator"
            onclick="add('(')">
            (
        </button>

        <button
            class="operator"
            onclick="add(')')">
            )
        </button>

        <button
            class="operator"
            onclick="add('/')">
            ÷
        </button>

        <button
            onclick="add('7')">
            7
        </button>

        <button
            onclick="add('8')">
            8
        </button>

        <button
            onclick="add('9')">
            9
        </button>

        <button
            class="operator"
            onclick="add('*')">
            ×
        </button>

        <button
            class="function"
            onclick="answer()">
            Ans
        </button>

        <button
            class="function"
            onclick="add('1/(')">
            1/x
        </button>

        <button onclick="add('4')">4</button>
        <button onclick="add('5')">5</button>
        <button onclick="add('6')">6</button>

        <button
            class="operator"
            onclick="add('-')">
            −
        </button>

        <button
            class="function"
            onclick="add('abs(')">
            |x|
        </button>

        <button
            class="function"
            onclick="add('Math.')">
            M.
        </button>

        <button onclick="add('1')">1</button>
        <button onclick="add('2')">2</button>
        <button onclick="add('3')">3</button>

        <button
            class="operator"
            onclick="add('+')">
            +
        </button>

        <button
            class="function"
            onclick="toggleSign()">
            +/−
        </button>

        <button
            class="function"
            onclick="add('π')">
            π
        </button>

        <button
            onclick="add('0')"
            style="grid-column:span 2">
            0
        </button>

        <button onclick="add('.')">
            .
        </button>

        <button
            class="function"
            onclick="add('e')">
            EXP
        </button>

        <button
            class="equal"
            onclick="calculate()">
            =
        </button>

    </div>

</section>


<!-- ================= HISTORY ================= -->

<section class="history">

    <div class="history-head">

        <h2>⚡ History</h2>

        <button
            class="clear-history"
            onclick="clearHistory()">
            CLEAR
        </button>

    </div>

    <div
        class="history-list"
        id="historyList">

        <div class="empty">
            No calculations yet.<br><br>
            Start calculating ✨
        </div>

    </div>

</section>

</div>


<div
    class="toast"
    id="toast">
</div>


<script>

/* ==========================================
   VARIABLES
========================================== */

let expression = "";
let lastAnswer = 0;
let memory = 0;
let angleMode = "DEG";
let history = [];


/* ==========================================
   ELEMENTS
========================================== */

const result =
    document.getElementById("result");

const expressionBox =
    document.getElementById("expression");


/* ==========================================
   DISPLAY
========================================== */

function update(){

    expressionBox.textContent =
        expression;

    result.textContent =
        expression || "0";

}


/* ==========================================
   ADD
========================================== */

function add(value){

    expression += value;

    update();

    pop();

}


/* ==========================================
   DISPLAY POP
========================================== */

function pop(){

    result.classList.remove("pop");

    void result.offsetWidth;

    result.classList.add("pop");

}


/* ==========================================
   CLEAR
========================================== */

function clearAll(){

    expression = "";

    update();

    sound(150,.06);

}


/* ==========================================
   DELETE
========================================== */

function deleteLast(){

    expression =
        expression.slice(0,-1);

    update();

}


/* ==========================================
   ANGLE
========================================== */

function toggleAngle(){

    angleMode =
        angleMode === "DEG"
        ? "RAD"
        : "DEG";

    document.getElementById("angle")
        .textContent = angleMode;

    toast("Angle mode: " + angleMode);

}


/* ==========================================
   FACTORIAL
========================================== */

function factorial(){

    expression += "!";

    update();

}


/* ==========================================
   SIGN
========================================== */

function toggleSign(){

    if(!expression) return;

    expression =
        "-(" + expression + ")";

    update();

}


/* ==========================================
   ANSWER
========================================== */

function answer(){

    expression += lastAnswer;

    update();

}


/* ==========================================
   CALCULATE
========================================== */

function calculate(){

    if(!expression) return;

    try{

        let exp = expression;

        exp = exp
            .replace(/π/g,"Math.PI")
            .replace(/√/g,"Math.sqrt")
            .replace(/\^/g,"**")
            .replace(/×/g,"*")
            .replace(/÷/g,"/")
            .replace(/%/g,"/100")
            .replace(/\be\b/g,"Math.E");

        exp = exp.replace(
            /log\(/g,
            "Math.log10("
        );

        exp = exp.replace(
            /ln\(/g,
            "Math.log("
        );

        exp = exp.replace(
            /abs\(/g,
            "Math.abs("
        );

        if(angleMode === "DEG"){

            exp = exp.replace(
                /sin\(/g,
                "Math.sin(Math.PI/180*("
            );

            exp = exp.replace(
                /cos\(/g,
                "Math.cos(Math.PI/180*("
            );

            exp = exp.replace(
                /tan\(/g,
                "Math.tan(Math.PI/180*("
            );

        }else{

            exp = exp.replace(
                /sin\(/g,
                "Math.sin("
            );

            exp = exp.replace(
                /cos\(/g,
                "Math.cos("
            );

            exp = exp.replace(
                /tan\(/g,
                "Math.tan("
            );

        }

        exp =
            replaceFactorial(exp);

        const value =
            Function(
                '"use strict";return (' +
                exp +
                ')'
            )();

        if(
            typeof value !== "number" ||
            !Number.isFinite(value)
        ){
            throw new Error();
        }

        const finalValue =
            Math.round(
                value * 10000000000
            ) / 10000000000;

        lastAnswer =
            finalValue;

        addHistory(
            expression,
            finalValue
        );

        expressionBox.textContent =
            expression + " =";

        expression =
            String(finalValue);

        result.textContent =
            finalValue;

        pop();

        sound(600,.12);

        burst();

    }
    catch{

        result.textContent =
            "ERROR";

        sound(90,.2);

        toast("Invalid expression");

        setTimeout(()=>{

            expression = "";

            update();

        },1000);

    }

}


/* ==========================================
   FACTORIAL
========================================== */

function replaceFactorial(exp){

    return exp.replace(
        /(\d+(?:\.\d+)?)!/g,
        function(_,num){

            let n =
                Number(num);

            if(
                n < 0 ||
                !Number.isInteger(n) ||
                n > 170
            )
                throw new Error();

            let total = 1;

            for(
                let i=2;
                i<=n;
                i++
            )
                total *= i;

            return total;

        }
    );

}


/* ==========================================
   HISTORY
========================================== */

function addHistory(exp,value){

    history.unshift({
        exp,
        value
    });

    if(history.length > 20)
        history.pop();

    renderHistory();

}


function renderHistory(){

    const box =
        document.getElementById(
            "historyList"
        );

    if(history.length === 0){

        box.innerHTML =
            `
            <div class="empty">
                No calculations yet.<br><br>
                Start calculating ✨
            </div>
            `;

        return;
    }

    box.innerHTML = "";

    history.forEach(item=>{

        const div =
            document.createElement("div");

        div.className =
            "history-item";

        div.innerHTML =
            `
            <div class="history-expression">
                ${item.exp}
            </div>

            <div class="history-result">
                = ${item.value}
            </div>
            `;

        div.onclick = ()=>{

            expression =
                String(item.value);

            update();

            toast("Result restored");

        };

        box.appendChild(div);

    });

}


function clearHistory(){

    history = [];

    renderHistory();

    toast("History cleared");

}


/* ==========================================
   MEMORY
========================================== */

function getValue(){

    try{

        let exp =
            expression
                .replace(/π/g,"Math.PI")
                .replace(/\^/g,"**");

        return Function(
            '"use strict";return (' +
            exp +
            ')'
        )();

    }catch{

        return 0;

    }

}


function memoryClear(){

    memory = 0;

    toast("Memory cleared");

}


function memoryRecall(){

    expression += memory;

    update();

}


function memoryAdd(){

    memory += getValue();

    toast("Added to memory");

}


function memorySub(){

    memory -= getValue();

    toast("Subtracted from memory");

}


/* ==========================================

function copyResult(){

    navigator.clipboard.writeText(

    );

    toast("✓ Result copied");

}


/* ==========================================
   TOAST
========================================== */

let toastTimer;

function toast(message){

    const box =
        document.getElementById("toast");

    box.textContent = message;

    box.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(()=>{
            box.classList.remove("show");
        },1600);

}


/* ==========================================
   RIPPLE TOUCH EFFECT
========================================== */

document.addEventListener(
    "click",
    function(e){

        const button =
            e.target.closest("button");

        if(!button) return;

        const ripple =
            document.createElement("span");

        ripple.className =
            "ripple";

        const rect =
            button.getBoundingClientRect();

        const size =
            Math.max(
                rect.width,
                rect.height
            );

        ripple.style.width =
            size + "px";

        ripple.style.height =
            size + "px";

        ripple.style.left =
            (e.clientX -
            rect.left -
            size/2) + "px";

        ripple.style.top =
            (e.clientY -
            rect.top -
            size/2) + "px";

        button.appendChild(ripple);

        setTimeout(
            ()=>ripple.remove(),
            600
        );

        button.classList.add("touched");

        setTimeout(
            ()=>button.classList.remove("touched"),
            150
        );

    }
);


/* ==========================================
   SOUND EFFECT
========================================== */

let audioContext;

function sound(
    frequency = 400,
    duration = .06
){

    try{

        if(!audioContext){

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        oscillator.frequency.value =
            frequency;

        oscillator.type =
            "sine";

        gain.gain.setValueAtTime(
            .035,
            audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            audioContext.currentTime +
            duration
        );

        oscillator.connect(gain);

        gain.connect(
            audioContext.destination
        );

        oscillator.start();

        oscillator.stop(
            audioContext.currentTime +
            duration
        );

    }catch{}

}


/* ==========================================
   KEYBOARD
========================================== */

document.addEventListener(
    "keydown",
    e=>{

        if(
            /[0-9.]/.test(e.key)
        ){

            add(e.key);

        }
        else if(
            ["+","-","*","/","(",")"]
            .includes(e.key)
        ){

            add(e.key);

        }
        else if(
            e.key === "Enter" ||
            e.key === "="
        ){

            e.preventDefault();

            calculate();

        }
        else if(
            e.key === "Backspace"
        ){

            deleteLast();

        }
        else if(
            e.key === "Escape"
        ){

            clearAll();

        }

    }
);


/* ==========================================
   MOUSE FOLLOW GLOW
========================================== */

const calculator =
    document.getElementById(
        "calculator"
    );

const mouseGlow =
    document.getElementById(
        "mouseGlow"
    );

calculator.addEventListener(
    "mousemove",
    e=>{

        const rect =
            calculator.getBoundingClientRect();

        mouseGlow.style.left =
            (e.clientX - rect.left) + "px";

        mouseGlow.style.top =
            (e.clientY - rect.top) + "px";

    }
);


/* ==========================================
   3D TILT EFFECT
========================================== */

calculator.addEventListener(
    "mousemove",
    e=>{

        if(window.innerWidth < 850)
            return;

        const rect =
            calculator.getBoundingClientRect();

        const x =
            (e.clientX - rect.left)
            / rect.width;

        const y =
            (e.clientY - rect.top)
            / rect.height;

        const rotateX =
            (0.5-y)*4;

        const rotateY =
            (x-0.5)*4;

        calculator.style.transform =
            `
            perspective(1000px)
            rotateX(${rotateX}deg)
            rotateY(${rotateY}deg)
            `;
    }
);


calculator.addEventListener(
    "mouseleave",
    ()=>{
        calculator.style.transform =
            "";
    }
);


/* ==========================================
   PARTICLES
========================================== */

const particleContainer =
    document.getElementById(
        "particles"
    );

for(let i=0;i<35;i++){

    const p =
        document.createElement("div");

    p.className =
        "particle";

    p.style.left =
        Math.random()*100 + "%";

    p.style.animationDuration =
        (6+Math.random()*12) + "s";

    p.style.animationDelay =
        (-Math.random()*15) + "s";

    p.style.opacity =
        .2+Math.random()*.6;

    particleContainer.appendChild(p);

}

update();
