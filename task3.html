<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Calculator</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #141e30, #243b55);
    transition: 0.4s;
}

body.light {
    background: linear-gradient(135deg, #e0eafc, #cfdef3);
}

.calculator {
    width: 360px;
    padding: 20px;
    border-radius: 25px;
    background: rgba(20, 20, 25, 0.9);
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    backdrop-filter: blur(15px);
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: white;
    margin-bottom: 15px;
}

.top h2 {
    font-size: 20px;
}

.theme {
    border: none;
    background: #333;
    color: white;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    cursor: pointer;
}

.display {
    background: #111;
    padding: 18px;
    border-radius: 15px;
    margin-bottom: 15px;
    text-align: right;
    color: white;
    min-height: 100px;
    overflow: hidden;
}

.previous {
    color: #888;
    font-size: 15px;
    min-height: 22px;
}

.current {
    font-size: 38px;
    margin-top: 8px;
    overflow-x: auto;
    white-space: nowrap;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

button {
    height: 62px;
    border: none;
    border-radius: 16px;
    font-size: 20px;
    cursor: pointer;
    background: #292929;
    color: white;
    transition: 0.15s;
}

button:hover {
    transform: translateY(-3px);
    filter: brightness(1.25);
}

button:active {
    transform: scale(0.92);
}

.operator {
    background: #ff9500;
}

.special {
    background: #555;
}

.equal {
    background: #00a86b;
}

.zero {
    grid-column: span 2;
}

.history {
    margin-top: 15px;
    color: white;
}

.history h3 {
    font-size: 15px;
    margin-bottom: 8px;
}

#historyList {
    max-height: 100px;
    overflow-y: auto;
    font-size: 13px;
    color: #aaa;
}

.history-item {
    padding: 5px 0;
    border-bottom: 1px solid #333;
}

body.light .calculator {
    background: rgba(255,255,255,0.8);
}

body.light .top,
body.light .history {
    color: #222;
}

body.light button {
    background: #ddd;
    color: #111;
}

body.light .operator {
    background: #ff9500;
    color: white;
}

body.light .equal {
    background: #00a86b;
    color: white;
}

body.light .display {
    background: #f5f5f5;
    color: #111;
}

body.light .current {
    color: #111;
}
</style>
</head>

<body>

<div class="calculator">

    <div class="top">
        <h2>🧮 Calculator</h2>
        <button class="theme" onclick="toggleTheme()">🌙</button>
    </div>

    <div class="display">
        <div class="previous" id="previous"></div>
        <div class="current" id="current">0</div>
    </div>

    <div class="buttons">

        <button class="special" onclick="clearAll()">AC</button>
        <button class="special" onclick="deleteLast()">⌫</button>
        <button class="special" onclick="percentage()">%</button>
        <button class="operator" onclick="chooseOperator('/')">÷</button>

        <button onclick="number('7')">7</button>
        <button onclick="number('8')">8</button>
        <button onclick="number('9')">9</button>
        <button class="operator" onclick="chooseOperator('*')">×</button>

        <button onclick="number('4')">4</button>
        <button onclick="number('5')">5</button>
        <button onclick="number('6')">6</button>
        <button class="operator" onclick="chooseOperator('-')">−</button>

        <button onclick="number('1')">1</button>
        <button onclick="number('2')">2</button>
        <button onclick="number('3')">3</button>
        <button class="operator" onclick="chooseOperator('+')">+</button>

        <button class="special" onclick="square()">x²</button>
        <button class="special" onclick="sqrt()">√</button>
        <button onclick="number('.')">.</button>
        <button class="equal" onclick="calculate()">=</button>

        <button class="zero" onclick="number('0')">0</button>
    </div>

    <div class="history">
        <h3>History</h3>
        <div id="historyList"></div>
    </div>

</div>

<script>

let current = "0";
let previous = "";
let operator = null;
let waiting = false;

const currentDisplay = document.getElementById("current");
const previousDisplay = document.getElementById("previous");
const historyList = document.getElementById("historyList");

function updateDisplay() {
    currentDisplay.innerText = current;
    previousDisplay.innerText =
        previous && operator ? previous + " " + operator : "";
}

function number(value) {

    if (waiting) {
        current = value === "." ? "0." : value;
        waiting = false;
        updateDisplay();
        return;
    }

    if (value === "." && current.includes(".")) return;

    if (current === "0" && value !== ".") {
        current = value;
    } else {
        current += value;
    }

    updateDisplay();
}

function chooseOperator(op) {

    if (operator && !waiting) {
        calculate();
    }

    previous = current;
    operator = op;
    waiting = true;

    updateDisplay();
}

function calculate() {

    if (!operator || waiting) return;

    let a = parseFloat(previous);
    let b = parseFloat(current);
    let result;

    if (operator === "+") result = a + b;
    if (operator === "-") result = a - b;
    if (operator === "*") result = a * b;
    if (operator === "/") {
        if (b === 0) {
            current = "Error";
            operator = null;
            previous = "";
            updateDisplay();
            return;
        }
        result = a / b;
    }

    result = Number(result.toFixed(10));

    addHistory(previous + " " + operator + " " + current + " = " + result);

    current = result.toString();
    previous = "";
    operator = null;
    waiting = true;

    updateDisplay();
}

function clearAll() {
    current = "0";
    previous = "";
    operator = null;
    waiting = false;
    updateDisplay();
}

function deleteLast() {

    if (current.length === 1) {
        current = "0";
    } else {
        current = current.slice(0, -1);
    }

    updateDisplay();
}

function percentage() {
    current = (parseFloat(current) / 100).toString();
    updateDisplay();
}

function square() {
    let value = parseFloat(current);
    let result = value * value;

    addHistory(value + "² = " + result);

    current = result.toString();
    updateDisplay();
}

function sqrt() {

    let value = parseFloat(current);

    if (value < 0) {
        current = "Error";
    } else {
        let result = Math.sqrt(value);

        addHistory("√" + value + " = " + result);

        current = result.toString();
    }

    updateDisplay();
}

function addHistory(text) {

    let item = document.createElement("div");

    item.className = "history-item";
    item.innerText = text;

    historyList.prepend(item);
}

function toggleTheme() {

    document.body.classList.toggle("light");

    const button = document.querySelector(".theme");

    if (document.body.classList.contains("light")) {
        button.innerText = "☀️";
    } else {
        button.innerText = "🌙";
    }
}

document.addEventListener("keydown", function(event) {

    if ((event.key >= "0" && event.key <= "9") || event.key === ".") {
        number(event.key);
    }

    if (["+", "-", "*", "/"].includes(event.key)) {
        chooseOperator(event.key);
    }

    if (event.key === "Enter" || event.key === "=") {
        calculate();
    }

    if (event.key === "Backspace") {
        deleteLast();
    }

    if (event.key === "Escape") {
        clearAll();
    }

    if (event.key === "%") {
        percentage();
    }

});

updateDisplay();

</script>

</body>
</html>
